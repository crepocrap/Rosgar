name: Build PixelCut Aero APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PixelCut Aero APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "::error::ZIP file not found in repository root"
            ls -la
            exit 1
          fi

          echo "Found archive: $ARCHIVE"

          mkdir -p android-project
          unzip -o "$ARCHIVE" -d android-project

          WRAPPER=$(find android-project -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "::error::No gradlew found. The ZIP must contain an Android Gradle project."
            find android-project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.extract.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCut-Aero-APK
          path: android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
